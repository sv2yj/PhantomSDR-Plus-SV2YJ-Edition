# systemd-tmpfiles rule for the PhantomSDR-Plus admin stack (admin.log + proxy.log)
#
# ── WHY THIS FILE EXISTS ─────────────────────────────────────────────────────
# The two systemd units write their logs with StandardOutput=append:. systemd
# opens that path from PID 1, BEFORE it drops to User=, so if the file does not
# exist yet it is created root:root 0644. The panel then runs as your user and
# cannot truncate it, and the Log Viewer's "Clear Logs" button fails with:
#
#   ✗ Could not clear admin.log ([Errno 13] Permission denied: …/admin.log)
#
# Only admin.log and proxy.log are affected — every other log is created by the
# launcher scripts, which already run as your user. The problem only appears on
# a machine that went straight to the systemd units on a clean tree; where the
# logs predate the units (manage_admin.sh created them with >>) they are already
# owned correctly and the button works.
#
# The two lines below re-create the logs with the right owner and mode at every
# boot, before the units start, so a deleted or reinstalled log never comes back
# root-owned. systemd ≥ 254 also repairs the mode and ownership of a file that
# already exists; on older versions the one-off chown below is what fixes it.
#
# ── EDIT ME BEFORE INSTALLING ────────────────────────────────────────────────
# Replace BOTH paths and the user:group with your own. Get the right values:
#
#   echo "$PWD"        # run from your PhantomSDR-Plus dir → the log paths
#   id -un; id -gn     # → the user and group
#
# ── INSTALL ──────────────────────────────────────────────────────────────────
#   sudo cp tmpfiles/phantomsdr-logs.conf \
#           /etc/tmpfiles.d/99-phantomsdr-logs.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/99-phantomsdr-logs.conf
#
# And repair the two logs that already exist, which is what unblocks the button
# on a machine that is already failing (chown, never rm: both files are held
# open O_APPEND, so deleting one leaves systemd filling an unlinked inode until
# the service restarts):
#
#   sudo chown YOUR_USER:YOUR_GROUP admin.log proxy.log
#   sudo chmod 664 admin.log proxy.log
#
# setup_admin.sh does all of the above for you when it installs the units —
# this copy is for a hand-installed setup, or to re-apply after moving the
# installation directory. As with logrotate/phantomsdr, this file is the repo
# master copy and /etc/tmpfiles.d/99-phantomsdr-logs.conf is an independent
# copy: editing this one changes nothing until you re-run the cp above.
#
# FULL MANUAL: docs/ADMIN_PANEL_SETUP.md
# ─────────────────────────────────────────────────────────────────────────────
f /home/YOUR_USER/PhantomSDR-Plus/admin.log 0664 YOUR_USER YOUR_GROUP -
f /home/YOUR_USER/PhantomSDR-Plus/proxy.log 0664 YOUR_USER YOUR_GROUP -
