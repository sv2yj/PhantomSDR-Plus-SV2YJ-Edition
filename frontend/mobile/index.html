<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- viewport-fit=cover so the layout can sit correctly around notches and
         the iOS home indicator; the component uses env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PhantomSDR+ Mobile</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b1016;
        color: #cfe3ff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* No rotation lock (not reliably possible on iOS anyway) — the app is
           laid out for both orientations. Just stop the rubber-band scroll. */
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- ── Failure reporter ───────────────────────────────────────────────
         Runs BEFORE the module bundle, so it also catches errors thrown while
         the bundle is being evaluated — the case that otherwise leaves a
         completely blank page with nothing to go on. Phones have no usable
         developer console, so the error is painted into the page instead. -->
    <script>
    (function () {
      var shown = false;
      function report(title, detail) {
        if (shown) return;
        shown = true;
        var el = document.getElementById('diag');
        var box = document.getElementById('diag-text');
        if (!el || !box) return;
        box.textContent = title + '\n\n' + detail;
        el.style.display = 'block';
      }

      window.addEventListener('error', function (e) {
        // Resource errors (a script/css that 404'd) have no .error and target
        // the failing element — report the URL, which is the useful part.
        if (e.target && e.target !== window && (e.target.src || e.target.href)) {
          report('Failed to load a file', String(e.target.src || e.target.href));
          return;
        }
        report(
          (e.error && e.error.name ? e.error.name : 'Error') + ': ' +
            (e.message || 'unknown'),
          (e.error && e.error.stack ? e.error.stack : (e.filename || '') + ':' + (e.lineno || ''))
        );
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        report(
          'Unhandled promise rejection',
          (r && r.stack) ? r.stack : String(r)
        );
      });

      // If nothing has rendered after 15s, say so rather than spinning forever.
      setTimeout(function () {
        var app = document.getElementById('app');
        if (app && app.children.length === 0) {
          report('The page never started',
                 'The script loaded but produced no interface within 15 seconds.\n' +
                 'userAgent:\n' + navigator.userAgent);
        }
      }, 15000);
    })();
    </script>

    <div id="diag" style="display:none;position:fixed;inset:0;z-index:99999;overflow:auto;
                          background:#160d0d;color:#ffd7d7;padding:16px;
                          font:12px/1.45 ui-monospace,Menlo,monospace;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;color:#ff8a8a">
        Mobile page failed to start
      </div>
      <pre id="diag-text" style="white-space:pre-wrap;word-break:break-word;margin:0"></pre>
      <div style="margin-top:14px;opacity:.6">Screenshot this and send it back.</div>
    </div>

    <script type="module" src="/src/mobile/main.js"></script>
  </body>
</html>
